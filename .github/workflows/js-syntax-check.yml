name: Sintaxis JS

on:
  push:
    branches: ["main"]
    paths:
      - "js/**"
      - "scripts/checks/**"
  pull_request:
    branches: ["main"]
    paths:
      - "js/**"
      - "scripts/checks/**"
  workflow_dispatch:

concurrency:
  group: js-syntax-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      # A diferencia de eslint/axe en este repo (avisan, no rompen — ver
      # accessibility.yml), esto SÍ bloquea el build. No es una cuestión de
      # estilo: un archivo que no parsea rompe la carga de JS en el sitio
      # entero, no solo la función que se tocó.
      - name: Verificar que todo el JS parsea
        run: |
          fail=0
          for f in js/*.js scripts/checks/*.mjs; do
            if ! node --check "$f"; then
              echo "❌ Error de sintaxis: $f"
              fail=1
            fi
          done
          exit $fail
